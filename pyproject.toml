[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubo-kuwait-research-engine"
version = "0.1.0"
description = "Auditable multi-source research and decision-support engine for Boursa Kuwait securities"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
kubo = "kubo.cli_v3:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
