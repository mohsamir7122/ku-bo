name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test contracts
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Codex control integrity
        run: python scripts/codex_control_check.py --root .
      - name: KU-BO-011 deterministic acceptance-corpus audit
        run: |
          python scripts/generate_ku_bo_011_corpus.py --check
          python scripts/audit_ku_bo_011_corpus.py --json
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Source parser and fresh-probe contract gates
        run: python -m unittest tests.test_source_parsers tests.test_live_probe -v
      - name: Official identity and calendar contract gates
        run: |
          python -m unittest \
            tests.test_official_parsers \
            tests.test_official_foundation_workspace \
            tests.test_official_foundation_import \
            -v
      - name: Security status and corporate-action schedule gates
        run: |
          python -m unittest \
            tests.test_status_corporate_parsers \
            tests.test_status_corporate_workspace \
            tests.test_status_corporate_import \
            -v
      - name: Corporate-action enrichment gates
        run: |
          python -m unittest \
            tests.test_ca_adjustments \
            tests.test_ca_enrichment_workspace \
            tests.test_ca_enrichment_import \
            -v
      - name: Historical status notice and interval gates
        run: |
          python -m unittest \
            tests.test_status_history \
            tests.test_status_history_workspace \
            tests.test_status_history_import \
            -v
      - name: Benchmark registry history and comparison gates
        run: |
          python -m unittest \
            tests.test_catalog_pack_pipeline \
            tests.test_benchmark_capability_catalog \
            tests.test_benchmark_registry \
            tests.test_benchmark_workspace \
            tests.test_benchmark_history \
            tests.test_benchmark_import \
            -v
      - name: Official complete daily EOD gates
        run: python -m unittest tests.test_official_eod_pipeline -v
      - name: Final data foundation reconciliation gates
        run: |
          python -m unittest \
            tests.test_foundation_io \
            tests.test_outcome_session_policy \
            tests.test_outcome_sessions \
            tests.test_ledger \
            tests.test_stopgates_evaluation \
            tests.test_data_foundation_reconciliation \
            tests.test_data_foundation_cli \
            -v
      - name: Synthetic smoke check
        run: python scripts/smoke_check.py
      - name: Secret-pattern guard
        run: python scripts/secret_guard.py
      - name: Build and exercise the repository-bound wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --force-reinstall dist/*.whl
          kubo --project-root "$GITHUB_WORKSPACE" validate-source-network
          kubo-data-foundation --project-root "$GITHUB_WORKSPACE" validate-pilot-config
          kubo-data-foundation --project-root "$GITHUB_WORKSPACE" validate-ca-formulas
          kubo-data-foundation --project-root "$GITHUB_WORKSPACE" validate-benchmark-registry
          kubo-data-foundation --help | grep -q "prepare-benchmark-history"
          kubo-data-foundation --help | grep -q "prepare-official-eod"
          kubo-data-foundation --help | grep -q "build-data-foundation-packet"
          kubo-data-foundation --help | grep -q "print-data-foundation-gate-report"
          kubo-data-foundation --project-root "$GITHUB_WORKSPACE" prepare-official-foundation \
            --output-root "$RUNNER_TEMP/kubo-official-workspace" \
            --run-id ci-official-workspace \
            --calendar-year 2026 \
            --prepared-by github-actions
          kubo-data-foundation --project-root "$GITHUB_WORKSPACE" prepare-status-corporate \
            --output-root "$RUNNER_TEMP/kubo-status-corporate-workspace" \
            --run-id ci-status-corporate-workspace \
            --action-window-from 2021-01-01 \
            --action-window-to 2026-08-09 \
            --prepared-by github-actions
          python scripts/installed_data_foundation_check.py \
            --project-root "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/kubo-installed-data-foundation-check"
