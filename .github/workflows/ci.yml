name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test contracts
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Codex control integrity
        if: matrix.python-version == '3.12'
        run: python scripts/codex_control_check.py --root .
      - name: Private predecessor migration preparation controls
        if: matrix.python-version == '3.12'
        run: |
          python scripts/validate_private_predecessor_migration_control.py --project-root . --json
      - name: Codex live bootstrap and previous-freeze contracts
        if: matrix.python-version == '3.12'
        run: |
          python scripts/validate_codex_live_bootstrap.py --project-root . --json
      - name: Fail-closed Kuwait automation schedule contract
        if: matrix.python-version == '3.12'
        run: |
          python scripts/validate_kuwait_automation_schedule.py --project-root .
      - name: KU-BO-011 deterministic acceptance-corpus audit
        if: matrix.python-version == '3.12'
        run: |
          python scripts/generate_ku_bo_011_corpus.py --check
          python scripts/audit_ku_bo_011_corpus.py --json
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic smoke check
        if: matrix.python-version == '3.12'
        run: python scripts/smoke_check.py
      - name: Secret-pattern guard
        if: matrix.python-version == '3.12'
        run: python scripts/secret_guard.py
      - name: Build and exercise the repository-bound wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          installed_venv="$RUNNER_TEMP/kubo-installed-wheel-venv"
          python -m venv "$installed_venv"
          "$installed_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/*.whl \
            jsonschema==4.25.1
          "$installed_venv/bin/python" -m pip check
          installed_python="$installed_venv/bin/python"
          installed_kubo="$installed_venv/bin/kubo"
          installed_foundation="$installed_venv/bin/kubo-data-foundation"
          "$installed_kubo" --project-root "$GITHUB_WORKSPACE" validate-source-network
          "$installed_kubo" --project-root "$GITHUB_WORKSPACE" validate-config
          "$installed_kubo" --project-root "$GITHUB_WORKSPACE" validate-research-workflow
          "$installed_kubo" --help | grep -q "run-source-search"
          "$installed_kubo" --help | grep -q "execute-public-source-access-probe"
          "$installed_kubo" --help | grep -q "build-kuwait-research-bundle"
          "$installed_kubo" --help | grep -q "evaluate-forty-session-replay"
          "$installed_kubo" --help | grep -q "validate-source-quality-policy"
          "$installed_kubo" --help | grep -q "validate-source-fallback-policy"
          "$installed_kubo" --help | grep -q "plan-source-fallback"
          "$installed_kubo" --help | grep -q "validate-market-scope"
          "$installed_kubo" --help | grep -q "validate-predecessor-capability-parity"
          "$installed_kubo" --help | grep -q "validate-portfolio-state"
          "$installed_kubo" --help | grep -q "validate-ku-bo-live-program"
          "$installed_kubo" --help | grep -q "validate-factor9-admission"
          "$installed_kubo" --help | grep -q "run-live-dry-run"
          "$installed_kubo" --help | grep -q "validate-live-dry-run"
          "$installed_foundation" --project-root "$GITHUB_WORKSPACE" validate-pilot-config
          "$installed_foundation" --project-root "$GITHUB_WORKSPACE" validate-ca-formulas
          "$installed_foundation" --project-root "$GITHUB_WORKSPACE" validate-benchmark-registry
          "$installed_foundation" --help | grep -q "prepare-benchmark-history"
          "$installed_foundation" --help | grep -q "prepare-official-eod"
          "$installed_foundation" --help | grep -q "build-data-foundation-packet"
          "$installed_foundation" --help | grep -q "print-data-foundation-gate-report"
          "$installed_foundation" --help | grep -q "issue-tri-security-semantic-admission"
          "$installed_foundation" issue-tri-security-semantic-admission --help \
            | grep -q -- "--operation-decision-at"
          "$installed_python" - <<'PY'
          from kubo.champion_freeze import validate_champion_freeze
          from kubo.automation_schedule import validate_automation_schedule
          from kubo.codex_live_bootstrap import validate_codex_live_bootstrap
          from kubo.factor9_admission import validate_factor9_admission_manifest
          from kubo.capability_parity import validate_predecessor_capability_parity
          from kubo.ku_bo_live_program import validate_ku_bo_live_program
          from kubo.live_dry_run import run_daily_dry_run, validate_live_dry_run
          from kubo.market_scope import validate_market_scope
          from kubo.portfolio_state import validate_portfolio_state
          from kubo.source_fallback import plan_source_fallback, validate_source_fallback_policy
          from kubo.source_quality import validate_source_quality_policy
          from kubo.tri_security_lineage import (
              LINEAGE_FILE,
              materialize_boundary_lineage,
              verify_boundary_lineage,
              verify_final_predecessor_lineages,
          )

          assert LINEAGE_FILE == "reports/tri_security_lineage.json"
          assert callable(materialize_boundary_lineage)
          assert callable(verify_boundary_lineage)
          assert callable(verify_final_predecessor_lineages)
          assert callable(validate_champion_freeze)
          assert callable(validate_automation_schedule)
          assert callable(validate_codex_live_bootstrap)
          assert callable(validate_factor9_admission_manifest)
          assert callable(validate_predecessor_capability_parity)
          assert callable(validate_ku_bo_live_program)
          assert callable(run_daily_dry_run)
          assert callable(validate_live_dry_run)
          assert callable(validate_market_scope)
          assert callable(validate_portfolio_state)
          assert callable(plan_source_fallback)
          assert callable(validate_source_fallback_policy)
          assert callable(validate_source_quality_policy)
          PY
          "$installed_foundation" --project-root "$GITHUB_WORKSPACE" prepare-official-foundation \
            --output-root "$RUNNER_TEMP/kubo-official-workspace" \
            --run-id ci-official-workspace \
            --calendar-year 2026 \
            --prepared-by github-actions
          "$installed_foundation" --project-root "$GITHUB_WORKSPACE" prepare-status-corporate \
            --output-root "$RUNNER_TEMP/kubo-status-corporate-workspace" \
            --run-id ci-status-corporate-workspace \
            --action-window-from 2021-01-01 \
            --action-window-to 2026-08-09 \
            --prepared-by github-actions
          "$installed_python" scripts/installed_data_foundation_check.py \
            --project-root "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/kubo-installed-data-foundation-check"
          if "$installed_python" -c \
            'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("kubo.ku_bo_011_adapter") else 1)'
          then
            "$installed_python" -m tests.ku_bo_011_harness --help \
              | grep -q -- "--strict-target-adapter"
            KUBO_KU_BO_011_CONFIG_DIR="$GITHUB_WORKSPACE/config" \
              "$installed_python" -m tests.ku_bo_011_harness \
              --strict-target-adapter \
              --adapter kubo.ku_bo_011_adapter:production_adapter
          fi
