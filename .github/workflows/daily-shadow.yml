name: Legacy Daily Shadow Contract (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubo-daily-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kuwait
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Validate handoff and freeze contracts
        run: |
          python scripts/validate_codex_live_bootstrap.py --project-root . --json
          python -m unittest \
            tests.test_codex_live_bootstrap \
            tests.test_champion_freeze \
            -v
      - name: State non-claims
        run: |
          echo "SUPERSEDED_SCHEDULE_MANUAL_COMPATIBILITY_ONLY"
          echo "CONTRACT_ONLY"
          echo "NO_NETWORK_COLLECTION"
          echo "NO_MODEL_TRAINING"
          echo "NO_STOCK_RECOMMENDATION"
